[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tctrebom-job_preemption_fairness_dedup"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出大模型推理优化工程师·作业抢占与调度公平性上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tctrebom" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tctrebom.github.io"
Repository = "https://github.com/tctrebom/job_preemption_fairness_dedup"
Issues = "https://github.com/tctrebom/job_preemption_fairness_dedup/issues"

[project.scripts]
job_preemption_fairness_dedup = "job_preemption_fairness_dedup:main"

[tool.setuptools]
py-modules = ["job_preemption_fairness_dedup"]
